# Reclaim tuned for swap on zram, from Omarchy's 99-omarchy-sysctl.conf.

# Above 100: evicting an anonymous page to zram is cheaper than dropping page cache
# that has to be re-read from disk. Stop at 150: each swapped page costs a compression.
vm.swappiness=150

# Halve the eagerness to drop dentry/inode cache, which can't spill to zram. Not lower: 0 can OOM.
vm.vfs_cache_pressure=50

# One page per swap-in fault: the default of 8 pays for a seek zram doesn't have.
vm.page-cluster=0

# Don't let fragmentation raise the watermarks into reclaim bursts while memory is still free.
vm.watermark_boost_factor=0

# Keep ~1.25% of memory free so kswapd reclaims in the background instead of
# allocations stalling in direct reclaim.
vm.watermark_scale_factor=125

# Cap dirty pages at 64M/256M instead of 10%/20% of RAM, so writeback doesn't
# pile up and flush in stalling bursts; the flusher can then wake every 15s.
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456
vm.dirty_writeback_centisecs=1500
