# systemd-oomd keys on PSI stall time, so it acts while the machine thrashes instead of
# after an allocation already failed (the kernel OOM killer). 50% = half of a 10s window
# stalled on memory; held 20s, losing one app is cheaper than the session (Omarchy's values).
# Which cgroups may be killed is set in the user drop-ins app.slice.d and tmux-spawn-.scope.d.
[OOM]
DefaultMemoryPressureDurationSec=20s
DefaultMemoryPressureLimit=50%
