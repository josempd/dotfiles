# NVIDIA-only desktop: the driver loads from the initramfs (early KMS, no flicker between boot and
# SDDM), and the Samsung TV's patched EDID is there before the first modeset (system/nvidia-cmdline.conf)
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
FILES+=(/usr/lib/firmware/edid/samsung_patched.bin)
