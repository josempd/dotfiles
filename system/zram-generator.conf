# Compressed swap in RAM, sized to all of RAM (Omarchy's 90-omarchy.conf). zstd averages
# around 3:1, so even a full device occupies roughly a third of RAM. The old 4G cap filled
# in seconds on 2026-10-27 and the kernel OOM killer took the session down.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
