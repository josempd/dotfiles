# Point the NVIDIA HDA card at the TV-only profile set (see nvidia-hdmi-tv.profile-set.conf)
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_2b_00.1"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        device.profile-set = "nvidia-hdmi-tv.conf"
      }
    }
  }
]
