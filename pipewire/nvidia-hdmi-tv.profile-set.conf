# NVIDIA HDA card: only the TV profile, so ACP can never grab the Lenovo PCM that 10-nvidia-hdmi-lenovo.conf owns
[General]
auto-profiles = yes

[Mapping hdmi-stereo]
description = Digital Stereo (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output
