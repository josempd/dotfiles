# Lenovo sink on hw:NVidia,7 beside the TV's ACP profile (none has both), format from its ELD; don't switch profiles in wiremix

context.objects = [
  { factory = adapter
    args = {
      factory.name         = api.alsa.pcm.sink
      node.name            = "alsa_output.nvidia-hdmi-lenovo"
      node.description     = "Lenovo R45w-30 (HDMI 2)"
      media.class          = "Audio/Sink"
      # Card name, not index: the ALSA index of the NVIDIA HDA changes across boots
      api.alsa.path        = "hw:NVidia,7"
      audio.format         = "S16LE"
      audio.rate           = 48000
      audio.channels       = 2
      audio.position       = "FL,FR"
      node.suspend-on-idle = true

      # Card metadata by hand (static nodes lack it), or Chromium/Electron list no audio devices
      device.class         = "sound"
      device.api           = "alsa"
      alsa.card            = "1"
      alsa.card_name       = "HDA NVidia"
      api.alsa.card        = "1"
    }
    flags = [ nofail ]
  }
]
