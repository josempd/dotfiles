# Static PipeWire sink for the Lenovo R45w-30 ultrawide on the NVIDIA HDA.
#
# The card's ACP profiles are mutually exclusive: output:hdmi-stereo (Samsung TV,
# hw:1,3) and output:hdmi-stereo-extra1 (Lenovo, hw:1,7) cannot both be active and
# no combined profile exists. ACP keeps managing the TV on its existing profile;
# this node binds hw:1,7 directly so both outputs exist at the same time.
#
# IMPORTANT CAVEAT: while this node exists it holds hw:1,7 open, so switching the
# HDA NVidia card profile to "Digital Stereo (HDMI 2) Output" in wiremix WILL fail
# silently -- ACP cannot claim a device this node already owns. Use this sink for
# the Lenovo instead of the profile switcher. Pick one mechanism, not both.
#
# Format from the panel ELD (/proc/asound/card1/eld#0.4): LPCM, 2ch, 48 kHz, 16-bit.
# nofail: a monitor that is off at boot cannot stop PipeWire from starting.

context.objects = [
  { factory = adapter
    args = {
      factory.name         = api.alsa.pcm.sink
      node.name            = "alsa_output.nvidia-hdmi-lenovo"
      node.description     = "Lenovo R45w-30 (HDMI 2)"
      media.class          = "Audio/Sink"
      # Card NAME, not index: the NVIDIA HDA is not guaranteed a stable ALSA index
      # across boots (it was card1, then the motherboard ALCS1200A took 1 and it
      # became card0, silently breaking this node). Names are stable.
      api.alsa.path        = "hw:NVidia,7"
      audio.format         = "S16LE"
      audio.rate           = 48000
      audio.channels       = 2
      audio.position       = "FL,FR"
      node.suspend-on-idle = true

      # Chromium/Electron enumerate audio devices through the PulseAudio API and
      # can return an empty device list when a sink carries no card association.
      # A static node has no PipeWire Device object behind it, so these have to be
      # set by hand -- every ACP-managed sink gets them for free.
      device.class         = "sound"
      device.api           = "alsa"
      alsa.card            = "1"
      alsa.card_name       = "HDA NVidia"
      api.alsa.card        = "1"
    }
    flags = [ nofail ]
  }
]
