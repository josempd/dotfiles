[ids]
*

# macOS layout: Left Alt is Cmd, Super is Option; system shortcuts go out as Ctrl+Super, bound in hyprland.lua

# keyd allows no trailing comments on section or binding lines

[main]
# Hold for the Cmd layer; a lone tap does nothing, so it never opens GTK/Electron menu bars
leftalt = overload(cmd, noop)
# hold = Option layer; keys it doesn't map stay Super, Hyprland's window keys.
leftmeta = layer(opt)

# :A keeps every key not overridden here as Alt (Alt+F4, tmux Alt+1/2/3 and Alt+G, readline Meta)
[cmd:A]
c = C-insert
v = S-insert
x = S-delete
a = C-a
s = C-s
z = C-z
f = C-f
t = C-t
w = C-w
r = C-r
n = C-n
o = C-o
p = C-p
l = C-l

# Quit app (mac Cmd+Q) -> Hyprland closes the window on Alt+F4; Cmd+W above closes tabs
q = A-f4

# Line/document jumps, Shift selects; takes Alt+arrows (back/forward is Cmd+[ / Cmd+], tmux resize is prefix+arrows)
left = home
right = end
up = C-home
down = C-end

# Cmd+Delete = delete to start of line
backspace = macro(S-home backspace)

# Browser back/forward (mac Cmd+[ / Cmd+])
leftbrace = A-left
rightbrace = A-right

# System shortcuts, handled by Hyprland: launcher, window switcher, minimize, hide
space = C-M-space
tab = C-M-tab
m = C-M-m
h = C-M-h

# Cmd+Shift+3/4/5 = screenshot of the screen / an area / an area into the editor
[cmd+shift]
3 = C-M-3
4 = C-M-4
5 = C-M-5

# Ctrl+Cmd+Q = lock screen. Also keeps Ctrl+Alt+F4 (a switch to tty4) off Cmd+Q.
[cmd+control]
q = C-M-q

# Option deletes by word; Option+arrows stay Super+arrows, Hyprland's focus keys
[opt:M]
backspace = C-backspace
delete = C-delete

# Ctrl+Left/Right = previous/next workspace (mac Spaces), handled by Hyprland.
[control]
left = C-M-left
right = C-M-right

# Ctrl+Shift+Left/Right pass through (tmux pane focus) instead of the workspace keys plus Shift
[control+shift]
left = C-S-left
right = C-S-right
