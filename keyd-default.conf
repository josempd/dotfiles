[ids]
*

# macOS layout: Left Alt is Cmd, Super is Option; system shortcuts go out as Ctrl+Alt+Super, bound in hyprland.lua

# keyd allows no trailing comments on section or binding lines

[main]
# Hold for the Cmd layer; a lone tap does nothing, so it never opens GTK/Electron menu bars
leftalt = overload(cmd, noop)
# hold = Option layer; keys it doesn't map stay Super, Hyprland's window keys.
leftmeta = layer(opt)

# :A keeps every key not overridden here as Alt (Alt+F4, tmux Alt+G, readline Meta)
[cmd:A]
c = C-insert
v = S-insert
x = S-delete
a = C-a
s = C-s
z = C-z
f = C-f
t = C-t
w = C-w
r = C-r
n = C-n
o = C-o
p = C-p
l = C-l

# Tabs 1..9 (browsers, tmux windows), zoom reset/in/out
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0
equal = C-equal
minus = C-minus

# Word and document jumps, Shift selects; takes Alt+arrows (back/forward is Cmd+[ / Cmd+], tmux resize is prefix+arrows)
left = C-left
right = C-right
up = C-home
down = C-end

# Cmd+Delete = delete to start of line
backspace = macro(S-home backspace)

# Browser back/forward (mac Cmd+[ / Cmd+])
leftbrace = A-left
rightbrace = A-right

# System shortcuts, handled by Hyprland: close window, power menu, launcher, window switcher, minimize, hide
q = C-A-M-q
escape = C-A-M-escape
space = C-A-M-space
tab = C-A-M-tab
m = C-A-M-m
h = C-A-M-h

# Cmd+Shift+3/4/5 = screenshot of the screen / an area / an area into the editor; Cmd+Shift+Q logs out; Cmd+Shift+0 stays tmux's tiled layout
[cmd+shift]
q = C-A-M-S-q
3 = C-A-M-s
4 = C-A-M-a
5 = C-A-M-e
0 = A-S-0

# Ctrl+Cmd+Q = lock screen
[cmd+control]
q = C-A-M-l

# Option deletes by word, Option+1/2/3 copy the last commands in tmux; other keys stay Super, Hyprland's window keys
[opt:M]
backspace = C-backspace
delete = C-delete
1 = A-1
2 = A-2
3 = A-3

# Super+Shift+1/2/3 still move the window to a workspace
[opt+shift]
1 = M-S-1
2 = M-S-2
3 = M-S-3

# Ctrl+Left/Right and Ctrl+1..0 = previous/next workspace and workspace N (mac Spaces), handled by Hyprland.
[control]
left = C-A-M-left
right = C-A-M-right
1 = C-A-M-1
2 = C-A-M-2
3 = C-A-M-3
4 = C-A-M-4
5 = C-A-M-5
6 = C-A-M-6
7 = C-A-M-7
8 = C-A-M-8
9 = C-A-M-9
0 = C-A-M-0

# Ctrl+Shift+Left/Right pass through (tmux pane focus) instead of the workspace keys plus Shift
[control+shift]
left = C-S-left
right = C-S-right
