[ids]
*

# macOS layout on a PC keyboard: Left Alt sits where Cmd is, Super where Option is.
# System shortcuts (Cmd+Tab, Cmd+Space, Ctrl+arrows...) are sent as Ctrl+Super
# combos, which nobody types by hand, and Hyprland binds those (hypr/hyprland.lua).
# NOTE: keyd does NOT allow trailing '#' comments on a [section] header line
# or on a binding line's value -- keep comments on their own lines.

[main]
# hold = Cmd layer; tap = noop so a lone Left-Alt tap no longer opens
# GTK/Electron (Slack, Firefox, etc.) menu bars. Alt combos still work.
leftalt = overload(cmd, noop)
# hold = Option layer; keys it doesn't map stay Super, Hyprland's window keys.
leftmeta = layer(opt)

# ':A' = behaves as normal Alt for any key NOT overridden below, preserving
# Alt+F4, tmux Alt+1/2/3 and Alt+G, readline Meta keys.
[cmd:A]
c = C-insert
v = S-insert
x = S-delete
a = C-a
s = C-s
z = C-z
f = C-f
t = C-t
w = C-w
r = C-r
n = C-n
o = C-o
p = C-p
l = C-l

# Quit app (mac Cmd+Q) -> Hyprland closes the window on Alt+F4; Cmd+W above closes tabs
q = A-f4

# Text navigation (mac line/document jumps). Shift passes through the layer,
# so Cmd+Shift+arrow = select to line/document boundary for free.
# NOTE: this consumes Alt+arrows (browser back/forward -> use Cmd+[ / Cmd+]
# below) and Shift+Alt+arrows (tmux pane resize -> moved to prefix+arrows).
left = home
right = end
up = C-home
down = C-end

# Cmd+Delete = delete to start of line
backspace = macro(S-home backspace)

# Browser back/forward (mac Cmd+[ / Cmd+])
leftbrace = A-left
rightbrace = A-right

# System shortcuts, handled by Hyprland: launcher, window switcher, minimize, hide
space = C-M-space
tab = C-M-tab
m = C-M-m
h = C-M-h

# Cmd+Shift+3/4/5 = screenshot of the screen / an area / an area into the editor
[cmd+shift]
3 = C-M-3
4 = C-M-4
5 = C-M-5

# Ctrl+Cmd+Q = lock screen. Also keeps Ctrl+Alt+F4 (a switch to tty4) off Cmd+Q.
[cmd+control]
q = C-M-q

# Option = word-wise delete, as on a Mac. Option+arrows stay Super+arrows,
# which Hyprland uses to move focus between windows.
[opt:M]
backspace = C-backspace
delete = C-delete

# Ctrl+Left/Right = previous/next workspace (mac Spaces), handled by Hyprland.
[control]
left = C-M-left
right = C-M-right

# Ctrl+Shift+Left/Right pass through untouched (tmux pane focus), instead of
# picking up the workspace keys above plus Shift.
[control+shift]
left = C-S-left
right = C-S-right
