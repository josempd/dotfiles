# Theme
include current-theme.conf

enabled_layouts splits

# Close without asking: sessions live in tmux, so nothing is lost
confirm_os_window_close 0

# keyd sends Cmd+C/V as Ctrl+Insert/Shift+Insert, which work alike in terminals and GTK/Qt apps
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Unmapped so they reach tmux, which owns splits, panes and resizing
map ctrl+shift+d
map ctrl+shift+s
map ctrl+shift+w
map ctrl+shift+q
map ctrl+shift+left
map ctrl+shift+right
map ctrl+shift+up
map ctrl+shift+down
map shift+alt+0

# Scrollback
map ctrl+shift+u show_scrollback

# Hints
map ctrl+shift+p>u kitten hints --type url --program @default
map ctrl+shift+p>p kitten hints --type path --program @
map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+p>h kitten hints --type hash --program @
# Agentic workflow: open a path / path:line on screen in the project nvim (nvim-open)
map ctrl+shift+p>n kitten hints --type linenum --linenum-action background nvim-open +{line} {path}
map ctrl+shift+p>f kitten hints --type path --program nvim-open

# Copy last command output / scrollback to clipboard
map ctrl+shift+o launch --stdin-source=@last_cmd_output --type=clipboard
map ctrl+shift+alt+o launch --stdin-source=@screen --type=clipboard
map ctrl+shift+alt+s launch --stdin-source=@screen_scrollback --type=clipboard

# Clear
map ctrl+l clear_terminal reset active

# Shift+Enter sends Alt+Enter, a newline in Claude Code and Codex, also inside tmux
map shift+enter send_text all \x1b\r
