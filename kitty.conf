# Theme
include current-theme.conf

enabled_layouts splits

#: Keybindings

# Copy / paste
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard
# Universal clipboard codes emitted by keyd's Cmd(LeftAlt) layer, so Cmd+C/V
# work identically in the terminal and GUI apps. (alt+c/v above kept as fallback
# for when keyd is stopped.) Ctrl+Insert / Shift+Insert are the standard
# terminal + GTK/Qt copy/paste convention and don't collide with SIGINT.
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Splits/navigation/resize are handled by tmux now (same keys).
# These are UNMAPPED (no action) so kitty passes them through to tmux instead
# of running its own defaults (e.g. ctrl+shift+w=close_window,
# ctrl+shift+left/right=prev/next tab). Per kitty docs, mapping a key to
# nothing forwards it to the program running in the terminal.
# To revert: delete this block and restore the original kitty bindings.
map ctrl+shift+d
map ctrl+shift+s
map ctrl+shift+w
map ctrl+shift+q
map ctrl+shift+left
map ctrl+shift+right
map ctrl+shift+up
map ctrl+shift+down
map shift+alt+left
map shift+alt+right
map shift+alt+up
map shift+alt+down
map shift+alt+0

# Scrollback
map ctrl+shift+u show_scrollback
map ctrl+shift+g show_last_command_output

# Hints
map ctrl+shift+p>u kitten hints --type url --program @default
map ctrl+shift+p>p kitten hints --type path --program @
map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+p>h kitten hints --type hash --program @
# Agentic workflow: open a path / path:line on screen in the project nvim (nvim-open)
map ctrl+shift+p>n kitten hints --type linenum --linenum-action background nvim-open +{line} {path}
map ctrl+shift+p>f kitten hints --type path --program nvim-open

# Copy last command output / scrollback to clipboard
map ctrl+shift+o launch --stdin-source=@last_cmd_output --type=clipboard
map ctrl+shift+alt+o launch --stdin-source=@screen --type=clipboard
map ctrl+shift+alt+s launch --stdin-source=@screen_scrollback --type=clipboard

# Jump between shell prompts
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt  1

# Reload config
map ctrl+shift+f5 load_config_file

# Clear
map ctrl+l clear_terminal reset active

# Shift+Enter = newline in Claude Code (and Codex), also inside tmux: send
# Alt+Enter (ESC + CR), which they treat as "insert newline"
map shift+enter send_text all \x1b\r
