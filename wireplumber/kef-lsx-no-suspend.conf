# KEF LSX II LT never suspends: its USB firmware hangs when the stream stops on idle (-110) until a replug

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-KEF_LSX_II_LT.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
