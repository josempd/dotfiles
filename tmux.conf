# ~/.tmux.conf — Catppuccin Mocha (Sky accent), tuned to feel like kitty
# Reload after edits:  prefix + r   (prefix is Ctrl+b)
# Command prompt (like nvim's ':'):  prefix then :

#### General ###################################################################
set -g  default-terminal "tmux-256color"
set -as terminal-features "xterm-kitty:RGB"      # truecolor inside kitty
set -as terminal-features "xterm-kitty:extkeys"  # forward Ctrl/Shift key combos
set -sg extended-keys-format csi-u                # disambiguate Ctrl+Shift+<key> (pi wants csi-u, not xterm)
set -g  focus-events on
set -sg escape-time 10                            # snappy ESC (nvim-friendly)
set -g  mouse on                                  # click panes, drag borders, wheel scroll
set -g  history-limit 100000                      # big scrollback
set -g  base-index 1                              # windows start at 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  set-clipboard on

# Agentic workflow: pass OSC 8 hyperlinks through to kitty (Ctrl+click opens them)
set -as terminal-features ",xterm-kitty:hyperlinks"
set -g  allow-passthrough on

#### Keybindings — mirror kitty ################################################
# Splits open in the current directory.
#   kitty ctrl+shift+d = vsplit (side by side)  -> tmux split -h
#   kitty ctrl+shift+s = hsplit (stacked)       -> tmux split -v
bind -n C-S-d split-window -h -c "#{pane_current_path}"
bind -n C-S-s split-window -v -c "#{pane_current_path}"
bind -n C-S-w kill-pane
# Ctrl+Shift+Q closes the whole session (e.g. an agentdev workspace), after y/n.
bind -n C-S-q confirm-before -p "Kill session #S and everything in it? (y/n)" kill-session

# Pane navigation (kitty ctrl+shift+arrows)
bind -n C-S-Left  select-pane -L
bind -n C-S-Down  select-pane -D
bind -n C-S-Up    select-pane -U
bind -n C-S-Right select-pane -R

# Pane resize: prefix + arrows, repeatable (-r) — keep tapping arrows after one
# prefix. Moved off Shift+Alt+arrows: keyd now maps Cmd(+Shift)+arrows to
# macOS-style line/document navigation and selection, which consumes those.
# Overrides tmux's default prefix+arrows (select-pane) — C-S-arrows do that here.
bind -r Left  resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
# Shift+Alt+0 still passes through keyd (digits unmapped in the Cmd layer).
bind -n S-M-0 select-layout tiled

# Prefix fallbacks (use if a Ctrl+Shift combo isn't forwarded by the terminal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# lazygit as a popup over the current pane's repo: Alt+G (or Alt+Shift+G).
# g isn't remapped by keyd. lazygit is linked into ~/.local/bin because the tmux
# server starts before ~/.zshrc adds ~/go/bin to PATH.
bind -n M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -n M-G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

#### Copy last command+output to clipboard (Alt+1/2/3) #########################
# zsh preexec/precmd hooks capture each command + its output into a 3-slot ring
# buffer (~/.cache/cmdcap/1..3, slot 1 = most recent). These copy a slot to the
# system clipboard via wl-copy. Alt+digits pass cleanly through keyd to tmux.
bind -n M-1 run-shell 'f="$HOME/.cache/cmdcap/1"; [ -s "$f" ] && wl-copy < "$f" && tmux display-message "clipboard: last command + output"'
bind -n M-2 run-shell 'f="$HOME/.cache/cmdcap/2"; [ -s "$f" ] && wl-copy < "$f" && tmux display-message "clipboard: 2nd-last command + output"'
bind -n M-3 run-shell 'f="$HOME/.cache/cmdcap/3"; [ -s "$f" ] && wl-copy < "$f" && tmux display-message "clipboard: 3rd-last command + output"'

#### Catppuccin Mocha theme — Sky accent (#89dceb) #############################
# palette: base #1e1e2e  surface0 #313244  subtext0 #a6adc8  text #cdd6f4
#          sky #89dceb   yellow #f9e2af
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name in a Sky pill
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89dceb,bold] #S #[fg=#89dceb,bg=#1e1e2e] "

# Right: date + time (time in a Sky pill)
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8,bg=#1e1e2e] %a %d %b #[fg=#89dceb,bg=#1e1e2e]#[fg=#1e1e2e,bg=#89dceb,bold] %H:%M "

# Windows
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#a6adc8,bg=#1e1e2e]  #I:#W  "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89dceb,bold]  #I:#W#{?window_zoomed_flag, [Z],}  "
setw -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e"

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89dceb"

# Messages and the ':' command line
set -g message-style         "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style            "bg=#89dceb,fg=#1e1e2e"   # copy-mode selection
setw -g clock-mode-colour    "#89dceb"
