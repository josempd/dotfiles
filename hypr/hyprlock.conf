# From Omarchy 3.8; colors and $wallpaper come from hyprlock-theme.conf (jmpd-theme)
source = ~/.config/hypr/hyprlock-theme.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = $wallpaper
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

