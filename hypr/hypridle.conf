# Screensaver after 15 minutes idle, always. Lock after 5 minutes idle only on
# battery, and before sleep. ac-no-sleep blocks suspend on AC power, not idle.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = ~/.local/bin/ac-no-sleep --on-ac || loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.local/bin/jmpd-screensaver-launch
}
