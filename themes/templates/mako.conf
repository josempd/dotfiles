# Adapted from Omarchy 3.8 (default/mako/core.ini). Colors from the current theme (jmpd-theme).
text-color={{ foreground }}
border-color={{ muted }}
background-color={{ lighter_background }}

anchor=top-right
group-by=app-name,summary,body
default-timeout=5000
width=420
margin=12
padding=8,12
border-size=1
border-radius=10
max-icon-size=32
font=JetBrainsMono Nerd Font 14px

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[urgency=critical]
border-color={{ red }}
default-timeout=0
layer=overlay
