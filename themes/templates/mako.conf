# Adapted from Omarchy 3.8 (default/mako/core.ini). Colors from the current theme (jmpd-theme).
text-color={{ foreground }}
border-color={{ accent }}
background-color={{ background }}

anchor=top-right
group-by=app-name,summary,body
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
max-icon-size=32
font=JetBrainsMono Nerd Font 11

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[urgency=critical]
default-timeout=0
layer=overlay
