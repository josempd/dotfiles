[Settings]
# Buttons on the left, as on a Mac; no minimize, Hyprland has no such state (Cmd+M goes to the scratchpad)
gtk-decoration-layout=close,maximize:
# Dark or light from the current theme (jmpd-theme)
gtk-application-prefer-dark-theme={{ prefer_dark }}
gtk-theme-name={{ gtk_theme }}
# Icons from the theme's icons.theme (a Yaru color)
gtk-icon-theme-name={{ icon_theme }}
