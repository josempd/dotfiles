[Settings]
# Window buttons on the left, as on a Mac. No minimize: Hyprland has no minimized
# state (Cmd+M sends the window to the scratchpad instead).
gtk-decoration-layout=close,maximize:
# Dark or light from the current theme (jmpd-theme)
gtk-application-prefer-dark-theme={{ prefer_dark }}
gtk-theme-name={{ gtk_theme }}
